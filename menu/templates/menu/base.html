<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Фудтрак «Колёса Вкуса»{% endblock %}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            background-color: #fef9f2;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .navbar-dark.bg-orange {
            background-color: #e67e22 !important;
        }
        .navbar-brand {
            font-size: 1.8rem;
            font-weight: bold;
            color: #fff !important;
        }
        .navbar-dark .navbar-nav .nav-link {
            color: rgba(255,255,255,.9) !important;
            font-weight: 500;
        }
        .navbar-dark .navbar-nav .nav-link:hover {
            color: #fff !important;
        }
        .hero {
            background: linear-gradient(135deg, #f39c12, #e74c3c);
            color: white;
            padding: 60px 0;
            text-align: center;
            margin-bottom: 30px;
        }
        .hero h1 {
            font-size: 3rem;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .hero p {
            font-size: 1.3rem;
            margin-bottom: 20px;
        }
        .category-title {
            border-bottom: 3px solid #e67e22;
            padding-bottom: 5px;
            margin-bottom: 20px;
            font-weight: bold;
            color: #d35400;
        }
        .card {
            transition: transform 0.2s, box-shadow 0.2s;
            border: none;
            border-radius: 15px;
            overflow: hidden;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .card-body {
            background: #fff;
        }
        .price {
            font-size: 1.4rem;
            font-weight: bold;
            color: #e67e22;
        }
        .btn-orange {
            background-color: #e67e22;
            border: none;
            color: white;
            font-weight: 600;
        }
        .btn-orange:hover {
            background-color: #d35400;
            color: white;
        }
        .btn-danger {
            background-color: #c0392b;
            border: none;
            font-weight: 600;
        }
        .footer {
            background-color: #2c3e50;
            color: #ecf0f1;
            padding: 20px 0;
            margin-top: auto;
            text-align: center;
        }
        .order-form .card {
            margin-bottom: 20px;
        }
        .quantity-input {
            max-width: 80px;
        }
        table td, table th {
            vertical-align: middle;
        }
    </style>
</head>
<body>
    <!-- Навигация -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-orange sticky-top">
        <div class="container">
            <a class="navbar-brand" href="{% url 'menu_list' %}">
                <i class="fas fa-truck"></i> FoodTruck
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'menu_list' %}"><i class="fas fa-utensils"></i> Меню</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link btn btn-warning text-dark fw-bold px-3 ms-2" href="{% url 'create_order' %}">
                            <i class="fas fa-shopping-cart"></i> Заказать сейчас
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Основное содержимое -->
    <main class="flex-shrink-0">
        {% block content %}{% endblock %}
    </main>

    <!-- Футер -->
    <footer class="footer">
        <div class="container">
            <span>&copy; 2026 Фудтрак «Колёса Вкуса». Все права защищены.</span>
        </div>
    </footer>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
